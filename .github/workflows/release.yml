name: Release

# Push a tag like v0.1.0 (matching project(VERSION) in CMakeLists.txt) to publish a release
# with builds for macOS (Apple Silicon), Windows (x64) and Linux (x64).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's/^project(MX300Control VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version in CMakeLists.txt"; exit 1; }

  macos:
    needs: check
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          brew install ninja
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          R=build/plugin/MX300Control_artefacts/Release
          name="MX300-Control-${GITHUB_REF_NAME}-macOS-arm64"
          stage="dist/$name"
          mkdir -p "$stage"
          cp -R "$R/Standalone/MX300 Control.app" "$R/AU/MX300 Control.component" "$R/VST3/MX300 Control.vst3" "$stage"/
          # ad-hoc signature over the whole bundle (the linker's only covers the binary); not an Apple Developer ID
          for b in "$stage"/*.app "$stage"/*.component "$stage"/*.vst3; do
            codesign --force --deep --sign - "$b"
            codesign --verify --strict "$b"
          done
          cp README.md LICENSE "$stage"/
          cat > "$stage"/INSTALL.txt <<'TXT'
          MX300 Control (unofficial), macOS 12+ on Apple Silicon. These builds are not signed by Apple.

          1. Copy the files:
               MX300 Control.component -> ~/Library/Audio/Plug-Ins/Components/
               MX300 Control.vst3      -> ~/Library/Audio/Plug-Ins/VST3/
               MX300 Control.app       -> /Applications/
          2. Allow them to run (they come from the internet and aren't notarized):
               xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/"MX300 Control.component" \
                 ~/Library/Audio/Plug-Ins/VST3/"MX300 Control.vst3" /Applications/"MX300 Control.app"
          3. Restart your DAW (Logic rescans Audio Units at launch).
          TXT
          ditto -c -k --sequesterRsrc --keepParent "$stage" "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.zip

  linux:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          R=build/plugin/MX300Control_artefacts/Release
          name="MX300-Control-${GITHUB_REF_NAME}-Linux-x64"
          stage="dist/$name"
          mkdir -p "$stage"
          cp -R "$R/VST3/MX300 Control.vst3" "$stage"/
          cp "$R/Standalone/MX300 Control" "$stage"/
          cp README.md LICENSE "$stage"/
          cat > "$stage"/INSTALL.txt <<'TXT'
          MX300 Control (unofficial), Linux x64 (built on Ubuntu 24.04). Untested on a real unit so far.

          1. Copy "MX300 Control.vst3" to ~/.vst3/
          2. Run "MX300 Control" for the standalone editor.
          The unit is found through ALSA MIDI (any port whose name contains "MX300"); otherwise pick the
          port in the ... menu. Needs ALSA, FreeType, Fontconfig and X11 (installed on most desktops).
          TXT
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.tar.gz

  windows:
    needs: check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $R = "build/plugin/MX300Control_artefacts/Release"
          $name = "MX300-Control-$env:GITHUB_REF_NAME-Windows-x64"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse "$R/VST3/MX300 Control.vst3" $stage
          Copy-Item "$R/Standalone/MX300 Control.exe" $stage
          Copy-Item README.md, LICENSE $stage
          @"
          MX300 Control (unofficial), Windows 10/11 x64. Untested on a real unit so far.

          1. Copy "MX300 Control.vst3" to C:\Program Files\Common Files\VST3\
          2. Run "MX300 Control.exe" for the standalone editor.
          The builds aren't code-signed, so Windows SmartScreen may warn on first launch ("More info" > "Run anyway").
          Windows lets only one program open a MIDI port at a time: if your DAW also has the MX300 port
          enabled for MIDI, disable it there so the plugin can use it.
          "@ | Set-Content "$stage/INSTALL.txt"
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "MX300 Control $GITHUB_REF_NAME" --generate-notes
